name: IvyCPG Daily Order Summary

on:
  schedule:
    # 8:00 PM IST = 2:30 PM UTC, Mon-Sat only
    - cron: '30 14 * * 1-6'

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests pytz

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run automation bot
        env:
          IVYDMS_USERNAME:    ${{ secrets.IVYDMS_USERNAME }}
          IVYDMS_PASSWORD:    ${{ secrets.IVYDMS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ivydms_autobot.py
